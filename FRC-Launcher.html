<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FreeRanksClient · Launching</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@7.3.1/css/all.min.css">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --b1:  #08080a;
      --b2:  #0d0d11;
      --b3:  #131318;
      --wb:  #16161b;
      --wh:  #1f1f25;
      --br:  #2a2a31;
      --brh: #3a3a44;
      --t:   #ededf0;
      --td:  #8e8e98;
      --tdd: #5e5e68;
      --w:   #fff;
      --r:   14px;
      --rs:  10px;
    }

    html,
    body {
      height: 100%;
    }

    body {
      font-family: -apple-system, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, var(--b1), var(--b2) 50%, var(--b3));
      background-attachment: fixed;
      color: var(--t);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
      line-height: 1.55;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 20% 20%, rgba(255, 255, 255, .045), transparent 45%),
        radial-gradient(circle at 80% 75%, rgba(255, 255, 255, .03),  transparent 45%),
        radial-gradient(circle at 50% 100%, rgba(255, 255, 255, .025), transparent 55%);
      pointer-events: none;
      z-index: 0;
    }

    /* ---------- Layout ---------- */

    .stage {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 460px;
      animation: sIn .5s cubic-bezier(.2, .8, .2, 1) both;
    }

    @keyframes sIn {
      from { opacity: 0; transform: translateY(16px) scale(.975); }
      to   { opacity: 1; transform: none; }
    }

    .window {
      background: var(--wb);
      border: 1px solid var(--br);
      border-radius: var(--r);
      overflow: hidden;
      box-shadow:
        0 30px 80px rgba(0, 0, 0, .65),
        0 0 0 1px rgba(255, 255, 255, .03) inset;
    }

    /* ---------- Title bar ---------- */

    .titlebar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 11px 14px;
      background: var(--wh);
      border-bottom: 1px solid var(--br);
      position: relative;
    }

    .lights {
      display: flex;
      gap: 7px;
      flex-shrink: 0;
    }

    .light {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }

    .red    { background: #ff5f57; cursor: pointer; transition: filter .2s, transform .15s; }
    .red:hover { filter: brightness(1.4); transform: scale(1.15); }
    .yellow { background: #febc2e; }
    .green  { background: #28c840; }

    .tt {
      position: absolute;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 13px;
      color: var(--td);
      font-weight: 500;
      pointer-events: none;
      padding: 0 80px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ---------- Body ---------- */

    .wb {
      padding: 34px 30px 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .ring {
      position: relative;
      width: 86px;
      height: 86px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 30% 25%, #26262e, #131318);
      border: 1px solid var(--brh);
      margin-bottom: 22px;
      animation: rp 2.2s ease-in-out infinite;
    }

    .ring::after {
      content: "";
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, .06);
      animation: hp 2.2s ease-in-out infinite;
    }

    @keyframes rp {
      0%, 100% {
        box-shadow:
          0 0 0 1px rgba(255, 255, 255, .03) inset,
          0 10px 30px rgba(0, 0, 0, .5),
          0 0 24px rgba(255, 255, 255, .05);
      }
      50% {
        box-shadow:
          0 0 0 1px rgba(255, 255, 255, .03) inset,
          0 10px 30px rgba(0, 0, 0, .5),
          0 0 48px rgba(255, 255, 255, .14);
      }
    }

    @keyframes hp {
      0%, 100% { opacity: .45; transform: scale(1); }
      50%      { opacity: 1;   transform: scale(1.06); }
    }

    .ring i {
      font-size: 2.1rem;
      line-height: 1;
      color: var(--w);
      animation: fa-spin 1.1s linear infinite;
    }

    .wb h2 {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -.4px;
      margin-bottom: 6px;
    }

    .sub {
      font-size: .9rem;
      color: var(--td);
      margin-bottom: 26px;
    }

    /* ---------- Progress ---------- */

    .pw {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, .06);
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 10px;
    }

    .pb {
      position: relative;
      height: 100%;
      width: 0;
      border-radius: 4px;
      background: linear-gradient(90deg, #fff, #8e8e98);
      transition: width .45s cubic-bezier(.22, 1, .36, 1);
      overflow: hidden;
    }

    .pb::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .55), transparent);
      animation: sh 1.6s linear infinite;
    }

    @keyframes sh {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    .pm {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      font-size: .75rem;
      color: var(--td);
      margin-bottom: 22px;
    }

    .pm span:first-child {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .pct {
      flex-shrink: 0;
      background: rgba(255, 255, 255, .06);
      border: 1px solid rgba(255, 255, 255, .08);
      padding: 3px 10px;
      border-radius: 20px;
      font-weight: 600;
      color: var(--t);
      font-size: .68rem;
      font-variant-numeric: tabular-nums;
    }

    /* ---------- Steps ---------- */

    .steps {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 8px;
      text-align: left;
    }

    .step {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      border-radius: var(--rs);
      background: rgba(255, 255, 255, .02);
      border: 1px solid rgba(255, 255, 255, .04);
      font-size: .8rem;
      color: var(--tdd);
      opacity: .55;
      transition: all .3s;
    }

    .dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 1.5px solid rgba(255, 255, 255, .18);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 8px;
      color: transparent;
      transition: all .3s;
    }

    .step.active {
      opacity: 1;
      color: var(--t);
      background: rgba(255, 255, 255, .05);
      border-color: rgba(255, 255, 255, .12);
    }

    .step.active .dot {
      border-color: rgba(255, 255, 255, .15);
      border-top-color: var(--w);
      animation: fa-spin .8s linear infinite;
    }

    .step.done {
      opacity: 1;
      color: var(--td);
      background: rgba(255, 255, 255, .03);
      border-color: rgba(255, 255, 255, .08);
    }

    .step.done .dot {
      background: var(--w);
      border-color: var(--w);
      color: #0a0a0c;
    }

    /* ---------- Hint ---------- */

    .hint {
      margin-top: 16px;
      text-align: center;
      font-size: 12px;
      color: var(--tdd);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      letter-spacing: -.1px;
    }

    .hd {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #febc2e;
      flex-shrink: 0;
      box-shadow: 0 0 8px rgba(254, 188, 46, .55);
      animation: hb 1.8s ease-in-out infinite;
    }

    @keyframes hb {
      0%, 100% { opacity: 1; }
      50%      { opacity: .35; }
    }

    /* ---------- Error state ---------- */

    body.err .ring {
      animation: none;
      border-color: rgba(255, 95, 87, .45);
      box-shadow:
        0 0 0 1px rgba(255, 95, 87, .12) inset,
        0 10px 30px rgba(0, 0, 0, .5),
        0 0 40px rgba(255, 95, 87, .18);
    }

    body.err .ring::after {
      animation: none;
      opacity: .4;
    }

    body.err .ring i {
      color: #ff7b73;
      animation: none;
    }

    body.err .pb {
      background: linear-gradient(90deg, #ff5f57, #a33);
    }

    body.err .hd {
      background: #ff5f57;
      box-shadow: 0 0 8px rgba(255, 95, 87, .55);
    }

    /* ---------- Responsive ---------- */

    @media (max-width: 520px) {
      body { padding: 20px 14px; }

      .wb { padding: 26px 20px 24px; }

      .ring { width: 72px; height: 72px; margin-bottom: 18px; }
      .ring i { font-size: 1.75rem; }

      .wb h2 { font-size: 1.2rem; }
      .sub   { font-size: .84rem; }
    }
  </style>
</head>

<body>
  <div class="stage">
    <div class="window">

      <div class="titlebar">
        <div class="lights">
          <div class="light red" id="x" title="Close"></div>
          <div class="light yellow"></div>
          <div class="light green"></div>
        </div>
        <div class="tt" id="tt">FreeRanksClient · Launching</div>
      </div>

      <div class="wb">
        <div class="ring" id="ring">
          <i class="fa-solid fa-spinner fa-spin-snap" id="sp"></i>
        </div>

        <h2 id="h">Loading client</h2>
        <p class="sub" id="sb">Preparing FreeRanksClient, please wait…</p>

        <div class="pw">
          <div class="pb" id="bar"></div>
        </div>

        <div class="pm">
          <span id="st">Initializing…</span>
          <span class="pct" id="pc">0%</span>
        </div>

        <div class="steps" id="steps">
          <div class="step">
            <span class="dot"><i class="fa-solid fa-check"></i></span>
            <span>Connecting to server</span>
          </div>
          <div class="step">
            <span class="dot"><i class="fa-solid fa-check"></i></span>
            <span>Verifying session</span>
          </div>
          <div class="step">
            <span class="dot"><i class="fa-solid fa-check"></i></span>
            <span>Loading ranks &amp; capes</span>
          </div>
          <div class="step">
            <span class="dot"><i class="fa-solid fa-check"></i></span>
            <span>Starting client</span>
          </div>
        </div>
      </div>

    </div>

    <p class="hint">
      <span class="hd"></span>Please don't close this window while the client loads
    </p>
  </div>

  <script>
    (function () {
      "use strict";
	  
	  const urlParams = new URLSearchParams(window.location.search);
	  const clientURL = urlParams.get('client');

      var bar     = document.getElementById("bar");
      var percent = document.getElementById("pc");
      var status  = document.getElementById("st");
      var title   = document.getElementById("tt");
      var heading = document.getElementById("h");
      var sub     = document.getElementById("sb");
      var icon    = document.getElementById("sp");
      var ring    = document.getElementById("ring");
      var steps   = Array.prototype.slice.call(document.querySelectorAll("#steps .step"));

      var STAGES = [
        { to: 22,  label: "Connecting to server…"     },
        { to: 48,  label: "Verifying session…"        },
        { to: 76,  label: "Loading ranks and capes…"  },
        { to: 100, label: "Starting client…"          }
      ];

      var progress = 0;
      var stageIndex = 0;
      var finished = false;

      function setProgress(value) {
        progress = Math.max(progress, Math.min(100, value));
        bar.style.width = progress + "%";
        percent.textContent = Math.round(progress) + "%";
      }

      function setStatus(text) {
        if (text) status.textContent = text;
      }

      function markStep(index, state) {
        var el = steps[index];
        if (!el) return;
        el.classList.toggle("active", state === "active");
        el.classList.toggle("done",   state === "done");
      }

      function runStage() {
        if (finished || stageIndex >= STAGES.length) return;

        var stage = STAGES[stageIndex];
        setStatus(stage.label);
        markStep(stageIndex, "active");

        var timer = setInterval(function () {
          var remaining = stage.to - progress;

          if (remaining <= 0.6) {
            clearInterval(timer);
            setProgress(stage.to);
            markStep(stageIndex, "done");
            stageIndex++;

            if (stageIndex < STAGES.length) {
              setTimeout(runStage, 240);
            } else {
              setTimeout(finish, 340);
            }
            return;
          }

          setProgress(progress + Math.max(0.5, remaining * 0.13));
        }, 60);
      }

	function finish() {
		if (finished) return;
		finished = true;

		setProgress(100);
		setStatus("Ready");
		title.textContent   = "FreeRanksClient · Ready";
		heading.textContent = "Ready";
		sub.textContent     = "FreeRanksClient has loaded successfully.";

		icon.className = "fa-solid fa-circle-check";
		icon.style.animation = "none";
		ring.classList.add("is-ready");

		for (var i = 0; i < steps.length; i++) markStep(i, "done");

		if (clientURL) {
			setTimeout(() => {
				window.location.href = clientURL;
			}, 500);
		}
	}
      function fail(message) {
        if (finished) return;
        finished = true;

        document.body.classList.add("err");
        setStatus(message || "Something went wrong");
        title.textContent   = "FreeRanksClient · Error";
        heading.textContent = "Launch failed";
        sub.textContent     = "Please close this window and try again.";
        icon.className      = "fa-solid fa-triangle-exclamation";

        for (var i = 0; i < steps.length; i++) {
          steps[i].classList.remove("active");
        }
      }

      document.getElementById("x").addEventListener("click", function () {
        window.close();
      });

      // Public API for the launcher / native shell
      window.FRC = {
        setProgress: setProgress,
        setStatus:   setStatus,
        finish:      finish,
        fail:        fail
      };

      setTimeout(runStage, 320);
    })();
  </script>
</body>
</html>
