<style>
@keyframes fadeInScaleUp {
    0% { opacity: 0; transform: scale(0.6); }
    50% { opacity: 1; transform: scale(1.1); }
    100% { opacity: 1; transform: scale(1); }
}

@keyframes SnowflakeFall {
    0% { top: -10rem; }
    100% { top: calc(100% + 10rem); }
}

@keyframes SnowflakeSway {
    0% { transform: translateX(-2em) translateY(0px); }
    50% { transform: translateX(2em) translateY(-0.5em); }
    100% { transform: translateX(-2em) translateY(0px); }
}

.PurchaseWelcome .PurchaseWelcomeContinue {

    padding: 0.7rem 1rem;

    transition: transform 0.2s;
    z-index: 2;
    text-decoration: none;
    font-weight: 600;
    min-width: 200px;
}

.PurchaseWelcome .PurchaseWelcomeContinue:hover {
    transform: scale(1.05);
}

.PurchaseWelcome .PurchaseWelcomeContinue .ButtonBody {

}

.IconShower {
    height: 100%;
    left: 0px;
    position: absolute;
    top: 0px;
    width: 100%;
    pointer-events: none;
    overflow: hidden;
    z-index: 0;
}

.IconShower .Icon {
    position: absolute;
    top: -10rem;
    color: #ffb914;
}

.IconShower .Icon.IconGroup0 {
    font-size: 1rem;
    opacity: 0.7;
}
.IconShower .Icon.IconGroup1 {
    font-size: 0.7rem;
    opacity: 0.5;
}
.IconShower .Icon.IconGroup2 {
    font-size: 0.5rem;
    opacity: 0.3;
}

.IconShowerAnimationFall .Icon {
    animation-duration: 5s, 3s;
    animation-name: SnowflakeFall, SnowflakeSway;
    animation-timing-function: linear, ease-in-out;
    animation-iteration-count: infinite, infinite;
}
</style>
